[package]
name = "g13"
version = "0.2.0"
authors = ["Max Jöhnk <maxjoehnk@gmail.com>"]
edition = "2018"
description = "hidapi based crate to communicate with a Logitech G13 without accompanying drivers."
repository = "https://github.com/maxjoehnk/g13-rs"
license = "MIT"

[dependencies]
thiserror = "2"
bitflags = "1.3"
log = "0.4"
hidapi = { version = "2.6" }
